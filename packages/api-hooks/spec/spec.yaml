  /api/event-metrics:
    get:
      operationId: getEventMetrics
      summary: Get attendance metrics for a date range, plus optional comparison-year shifts
      tags:
        - Events
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      startDate:
                        type: string
                      endDate:
                        type: string
                      comparisonYears:
                        type: array
                        items:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                      includeAllTimes:
                        type: boolean
                    required:
                      - startDate
                      - endDate
                      - comparisonYears
                    additionalProperties: false
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        year:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        weekStart:
                          type: string
                        eventId:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        eventMetricId:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        eventStartDate:
                          type: string
                        metricTitle:
                          type: string
                        service:
                          type: string
                        venue:
                          type: string
                          description: "Top-level location of the attendance reading: 'Sanctuary', 'Chapel', 'Hangar', or 'Online'."
                        location:
                          type: string
                          description: Deprecated alias for `venue`; same value. Will be removed after consumers migrate to `venue`.
                        level:
                          type: string
                        value:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        metricId:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                          description:
                            MP Metric_ID. The Greater_Observation flag is only meaningful when this is between 11 and 28 (Sanctuary
                            section attendance counters).
                        greaterObservation:
                          type: boolean
                          description:
                            True when MP marks this row as the canonical observation for its (event, metric) pair. Used to dedupe
                            duplicate counter readings.
                        sermonId:
                          anyOf:
                            - type: integer
                              minimum: -9007199254740991
                              maximum: 9007199254740991
                            - type: 'null'
                        numericBenchmarkValue:
                          anyOf:
                            - type: integer
                              minimum: -9007199254740991
                              maximum: 9007199254740991
                            - type: 'null'
                          description:
                            Per-section seat count from Metrics.Numeric_Benchmark_Value. Populated for the Sanctuary section metrics
                            (Metric_ID 11..28) and null elsewhere.
                      required:
                        - year
                        - weekStart
                        - eventId
                        - eventMetricId
                        - eventStartDate
                        - metricTitle
                        - service
                        - venue
                        - location
                        - level
                        - value
                        - metricId
                        - greaterObservation
                        - sermonId
                        - numericBenchmarkValue
                      additionalProperties: false
                required:
                  - meta
                  - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Inclusive range start, YYYY-MM-DD
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Inclusive range end, YYYY-MM-DD
        - name: comparisonYears
          in: query
          required: false
          schema:
            description: Comma-separated years to include as shifted ranges, e.g. "2025,2024"
            type: string
        - name: aggregate
          in: query
          required: false
          schema:
            type: string
            enum:
              - weekly
        - name: includeAllTimes
          in: query
          required: false
          schema:
            description:
              When "true", events outside the canonical 9:00/10:45 service slots are returned with their actual local
              "H:MM" service time instead of being filtered out. Used by the holiday-comparison chart.
            type: string
            enum:
              - 'true'
              - 'false'
