  /api/events:
    get:
      operationId: listEvents
      summary: List events by Events List for the event-finder widget
      tags:
        - Events
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              exclusiveMinimum: 0
                              maximum: 9007199254740991
                            title:
                              type: string
                            description:
                              anyOf:
                                - type: string
                                - type: 'null'
                              description: HTML description, or null.
                            location:
                              anyOf:
                                - type: string
                                - type: 'null'
                              description: Location name (from Locations.Location_Name), or null.
                            startDate:
                              type: string
                              description: Event start, ISO 8601.
                            endDate:
                              type: string
                              description: Event end, ISO 8601.
                            detailType:
                              anyOf:
                                - type: string
                                - type: 'null'
                              description: Event detail type label, e.g. "Free"/"Paid"/"Tickets".
                            detailsUrl:
                              anyOf:
                                - type: string
                                - type: 'null'
                              description: Public "see details" URL (Event_Detail_Types.URL + event id), or null when the event has no detail type.
                          required:
                            - id
                            - title
                            - description
                            - location
                            - startDate
                            - endDate
                            - detailType
                            - detailsUrl
                          additionalProperties: false
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          perPage:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          total:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          totalPages:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                        required:
                          - page
                          - perPage
                          - total
                          - totalPages
                        additionalProperties: false
                    required:
                      - events
                      - pagination
                    additionalProperties: false
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                      cached:
                        type: boolean
                      timestamp:
                        type: string
                        format: date-time
                      pagination:
                        type: object
                        properties:
                          top:
                            type: integer
                          skip:
                            type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - name: listId
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d+(,\d+)*$
            description: One or more Events_List IDs (MP Events_Lists.Events_List_ID), comma-separated, e.g. "18,208".
        - name: congregationId
          in: query
          required: false
          schema:
            description: Filter to one congregation (Events.Congregation_ID).
            type: integer
            exclusiveMinimum: 0
            maximum: 9007199254740991
        - name: programId
          in: query
          required: false
          schema:
            description: Filter to one program (Events.Program_ID).
            type: integer
            exclusiveMinimum: 0
            maximum: 9007199254740991
        - name: tierId
          in: query
          required: false
          schema:
            description: One or more Tier IDs (Events.Tier), comma-separated.
            type: string
            pattern: ^\d+(,\d+)*$
        - name: featured
          in: query
          required: false
          schema:
            description: When "true", only events Featured_On_Calendar.
            type: string
            enum:
              - 'true'
              - 'false'
        - name: signupType
          in: query
          required: false
          schema:
            description: 'Filter by signup kind: "1" = open online registration, "2" = active volunteer opportunity.'
            type: string
            enum:
              - '1'
              - '2'
        - name: month
          in: query
          required: false
          schema:
            description: Filter to events whose start month is this (1-12).
            type: integer
            minimum: 1
            maximum: 12
        - name: keyword
          in: query
          required: false
          schema:
            description: Case-insensitive search over event title and description.
            type: string
            maxLength: 100
        - name: maxEvents
          in: query
          required: false
          schema:
            description: Cap the total number of events returned (legacy @MaxEvents).
            type: integer
            minimum: 1
            maximum: 1000
        - name: from
          in: query
          required: false
          schema:
            description: Inclusive lower bound on event start date, YYYY-MM-DD.
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: to
          in: query
          required: false
          schema:
            description: Inclusive upper bound on event start date, YYYY-MM-DD.
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: includePast
          in: query
          required: false
          schema:
            description:
              When "true", past events are included. By default (absent/"false") only events that have not yet ended are
              returned.
            type: string
            enum:
              - 'true'
              - 'false'
        - name: page
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: perPage
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
        - name: order
          in: query
          required: false
          schema:
            default: asc
            description: Sort direction on event start date. Defaults to ascending.
            type: string
            enum:
              - asc
              - desc
