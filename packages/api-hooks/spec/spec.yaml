openapi: 3.1.0
info:
  title: Perimeter API
  version: 0.1.0
  description: Backend API for Perimeter Church applications
servers:
  - url: https://api.perimeter.org
    description: Production
  - url: http://localhost:5500
    description: Development
security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Ministry Platform OAuth JWT token
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Server-to-server API key
  schemas:
    ApiErrorBody:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
  responses:
    BadRequest:
      description: Validation error
      content: &a1
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    Unauthorized:
      description: Missing or invalid authentication
      content: *a1
    Forbidden:
      description: Insufficient permissions
      content: *a1
    NotFound:
      description: Resource not found
      content: *a1
    InternalError:
      description: Internal server error
      content: *a1
paths:
  /api/auth/me:
    get:
      operationId: getMe
      summary:
        Returns the authenticated caller (userId, email, isAgent, isAdmin, workspaces) for RBAC checks in sibling
        frontend apps
      tags:
        - Auth
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      userId:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      email:
                        type: string
                      isAgent:
                        type: boolean
                      isAdmin:
                        type: boolean
                      workspaces:
                        type: array
                        items:
                          type: object
                          properties:
                            agentWorkspaceID:
                              type: integer
                              exclusiveMinimum: 0
                              maximum: 9007199254740991
                            workspaceID:
                              type: integer
                              exclusiveMinimum: 0
                              maximum: 9007199254740991
                            agentID:
                              type: integer
                              exclusiveMinimum: 0
                              maximum: 9007199254740991
                            isAdmin:
                              type: boolean
                          required:
                            - agentWorkspaceID
                            - workspaceID
                            - agentID
                            - isAdmin
                          additionalProperties: false
                    required:
                      - userId
                      - email
                      - isAgent
                      - isAdmin
                      - workspaces
                    additionalProperties: false
                    description:
                      Authenticated caller identity with helpdesk agent + admin status sourced from Helpdesk_Agents and
                      Helpdesk_Agent_Workspaces
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                      cached:
                        type: boolean
                      timestamp:
                        type: string
                        format: date-time
                      pagination:
                        type: object
                        properties:
                          top:
                            type: integer
                          skip:
                            type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security: &a2
        - bearerAuth: []
  /api/sermons:
    get:
      operationId: listSermons
      summary: List sermons with pagination and filtering
      tags:
        - Sermons
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      sermons:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                            title:
                              type: string
                            subtitle:
                              anyOf:
                                - type: string
                                - type: 'null'
                            shortDescription:
                              anyOf:
                                - type: string
                                - type: 'null'
                            date:
                              type: string
                            bannerUrl:
                              anyOf:
                                - type: string
                                - type: 'null'
                            speaker:
                              type: object
                              properties:
                                id:
                                  type: number
                                name:
                                  type: string
                              required:
                                - id
                                - name
                              additionalProperties: false
                            series:
                              type: object
                              properties:
                                id:
                                  type: number
                                title:
                                  type: string
                              required:
                                - id
                                - title
                              additionalProperties: false
                            congregation:
                              type: object
                              properties:
                                id:
                                  type: number
                              required:
                                - id
                              additionalProperties: false
                            book:
                              anyOf:
                                - type: object
                                  properties:
                                    id:
                                      type: number
                                    name:
                                      type: string
                                  required:
                                    - id
                                    - name
                                  additionalProperties: false
                                - type: 'null'
                          required:
                            - id
                            - title
                            - subtitle
                            - shortDescription
                            - date
                            - bannerUrl
                            - speaker
                            - series
                            - congregation
                            - book
                          additionalProperties: false
                      pagination:
                        type: object
                        properties:
                          page:
                            type: number
                          perPage:
                            type: number
                          total:
                            type: number
                          totalPages:
                            type: number
                        required:
                          - page
                          - perPage
                          - total
                          - totalPages
                        additionalProperties: false
                    required:
                      - sermons
                      - pagination
                    additionalProperties: false
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                      cached:
                        type: boolean
                      timestamp:
                        type: string
                        format: date-time
                      pagination:
                        type: object
                        properties:
                          top:
                            type: integer
                          skip:
                            type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: seriesId
          in: query
          required: false
          schema:
            type: string
        - name: speakerId
          in: query
          required: false
          schema:
            type: string
        - name: bookId
          in: query
          required: false
          schema:
            type: string
        - name: congregationId
          in: query
          required: false
          schema:
            type: integer
            exclusiveMinimum: 0
            maximum: 9007199254740991
        - name: serviceTypeId
          in: query
          required: false
          schema:
            type: string
        - name: seriesTypeId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: page
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: perPage
          in: query
          required: false
          schema:
            default: 12
            type: integer
            minimum: 1
            maximum: 50
        - name: sort
          in: query
          required: false
          schema:
            default: date
            type: string
            enum:
              - date
              - title
        - name: order
          in: query
          required: false
          schema:
            default: desc
            type: string
            enum:
              - asc
              - desc
