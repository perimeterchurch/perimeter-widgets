<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embed Lab — multiple widgets</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      h2 {
        margin-top: 3rem;
        border-top: 1px solid #e2e8f0;
        padding-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <h1>multi — two widgets, one loader tag</h1>
    <p><a href="/">← lab index</a></p>
    <p>
      One loader scan mounts both; each bundle loads once (check the Network tab: one
      <code>index.js</code> per widget name). The example widget renders dark to prove per-embed
      theming is independent.
    </p>

    <script src="/loader.js" data-nowprocket async></script>

    <h2>sermons (light)</h2>
    <div data-perimeter-widget="sermons"></div>

    <h2>example (dark)</h2>
    <div data-perimeter-widget="example" data-theme="dark"></div>
  </body>
</html>
