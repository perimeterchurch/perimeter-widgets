name: Build and Purge CDN

on:
    push:
        branches: [main]

jobs:
    build-and-purge:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: read
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@perimeterchurch'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Run quality checks
              run: pnpm quality

            - name: Build all widgets
              run: pnpm build

            - name: Check for dist changes
              id: check-dist
              run: |
                  set -euo pipefail
                  if git diff --quiet dist/; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                  else
                    echo "changed=true" >> $GITHUB_OUTPUT
                  fi

            - name: Commit dist changes
              if: steps.check-dist.outputs.changed == 'true'
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add dist/
                  git commit -m "chore: update built widget files"
                  git push

            # Copy the freshly-built dist/ to dev so both branches stay in sync.
            # Without this, every release PR from dev → main conflicts on
            # dist/ because main has CI commits that dev doesn't know about.
            # We can't fast-forward (dev has feature commits main doesn't), so
            # we check out dev, overwrite its dist/, commit, and push.
            - name: Backport dist to dev
              if: steps.check-dist.outputs.changed == 'true'
              run: |
                  set -euo pipefail
                  cp -r dist/ /tmp/dist-backup
                  git fetch origin dev --depth=1
                  git checkout origin/dev
                  # If checkout silently kept us on the previous ref, the
                  # subsequent push would land on the wrong branch.
                  current_head=$(git rev-parse HEAD)
                  expected_head=$(git rev-parse origin/dev)
                  if [ "$current_head" != "$expected_head" ]; then
                      echo "Failed to check out origin/dev (HEAD=$current_head, expected=$expected_head)" >&2
                      exit 1
                  fi
                  cp -r /tmp/dist-backup/. dist/
                  git add dist/
                  if ! git diff --staged --quiet; then
                      git commit -m "chore: sync built widget files from main"
                      git push origin HEAD:refs/heads/dev
                  fi
                  git checkout -

            # jsDelivr's @latest resolves to the highest semver tag, NOT main HEAD.
            # Without a tag bump, every release leaves @latest pointing at the previous
            # tag and the new dist/ never reaches embedded sites until the cache TTL
            # expires (and even then @latest is wrong). Bump the patch and tag.
            - name: Bump patch tag for @latest
              if: steps.check-dist.outputs.changed == 'true'
              id: tag
              run: |
                  set -euo pipefail
                  git fetch --tags
                  latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
                  if [ -z "$latest_tag" ]; then
                      next_tag="v0.1.0"
                  else
                      base=${latest_tag#v}
                      IFS=. read -r major minor patch <<< "$base"
                      next_tag="v${major}.${minor}.$((patch + 1))"
                  fi
                  echo "Tagging $next_tag (previous: ${latest_tag:-none})"
                  git tag "$next_tag"
                  git push origin "$next_tag"
                  echo "tag=$next_tag" >> $GITHUB_OUTPUT

            - name: Purge jsDelivr cache
              if: steps.check-dist.outputs.changed == 'true'
              run: |
                  node --input-type=module << 'EOF'
                  import { readFileSync } from 'fs';
                  const manifest = JSON.parse(readFileSync('./dist/manifest.json', 'utf8'));
                  const widgets = Object.values(manifest.widgets);
                  // Purge both @latest and the new tag, just in case anyone hit
                  // either URL before the tag landed.
                  const tag = process.env.NEW_TAG;
                  const refs = ['@latest', tag ? '@' + tag : null].filter(Boolean);
                  const tasks = widgets.flatMap((w) =>
                      refs.map(async (ref) => {
                          const url = `https://purge.jsdelivr.net/gh/PerimeterChurch/perimeter-widgets${ref}/${w.file}`;
                          console.log('Purging: ' + url);
                          const r = await fetch(url);
                          console.log('  Status: ' + r.status);
                      }),
                  );
                  await Promise.all(tasks);
                  EOF
              env:
                  NEW_TAG: ${{ steps.tag.outputs.tag }}
