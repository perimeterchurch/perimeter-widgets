# Production deploys of the perimeter-widgets-studio Vercel project
# (style.perimeter.org, root directory studio-host/), built here rather than
# by Vercel's Git integration. The widgets-cdn project (cdn/) is separate
# and still deploys through Vercel's Git integration.
#
# The CLI runs from the repo root and applies the project's Root Directory
# (studio-host) itself, the same way Vercel's own build did. Pushes that only
# touch docs are skipped.
#
# Vercel blocks a deploy whose commit author can't deploy on the Vercel team
# (not a member, or a Viewer), so a release carrying such a commit never went
# live. This workflow builds and deploys with a token from a team member's
# account, so every deploy is that member's whoever wrote the commits.
# studio-host/vercel.json turns Vercel's own Git deploys off for
# this project only.
#
# Only main deploys, and only main can read the token (Vercel Security
# Review, 2026-11-05). A push runs the workflow file from the pushed branch,
# so any branch whose run could read VERCEL_TOKEN could edit its copy of this
# file to print it, and the token can do far more than deploy (it reads every
# project's environment variables on the team). So:
# - VERCEL_TOKEN is a secret of the `vercel-production` GitHub environment,
#   whose deployment branch rule allows main alone. GitHub enforces that rule
#   outside this file, so an edited copy on another branch gets no token.
#   It must not also exist as a repository secret.
# - There are no preview deploys. Preview a branch locally (`pnpm dev`), or
#   deploy one by hand from a team member's machine (`vercel deploy`).
#
# Secrets: VERCEL_TOKEN (environment `vercel-production`; a Vercel account
# token scoped to the Perimeter Church team; tokens expire, and when it does
# this fails at "Pull Vercel settings"), VERCEL_ORG_ID and VERCEL_PROJECT_ID.
# Dependabot runs get no secrets, so they're skipped.
#
# Environment variables come from the Vercel project via `vercel pull`.
# Anything read at build time (NEXT_PUBLIC_*, BETTER_AUTH_URL) must not be
# marked Sensitive in Vercel: the CLI receives a placeholder for Sensitive
# values, and the build fails or bakes in the placeholder.

name: vercel deploy (studio)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Production deploys queue; none is cancelled.
concurrency:
  group: vercel-studio-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL: pnpm dlx vercel@65.9.0

jobs:
  deploy:
    # A manual run from another branch is refused here, and the
    # environment's branch rule would withhold the token anyway.
    if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    environment: vercel-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Node 22 matches the Vercel project's runtime setting (the studio's
      # Vite build needs 22.18 or later, which setup-node's latest 22 is).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Pull Vercel settings
        run: $VERCEL pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: $VERCEL build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        run: |
          # Without a terminal the CLI prints just the deployment URL
          # on stdout (progress goes to stderr).
          out=$($VERCEL deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          url=$(printf '%s\n' "$out" | grep -oE 'https://[a-z0-9.-]+\.vercel\.app' | head -1)
          case "$url" in https://*) ;; *) echo "No deployment URL in the CLI's output" >&2; exit 1 ;; esac
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
